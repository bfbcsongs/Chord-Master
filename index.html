<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChordCraft Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d' },
            slate: { 850: '#1e293b', 900: '#0f172a', 950: '#020617' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: monospace, system-ui, sans-serif; touch-action: manipulation; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    
    .char-node { position: relative; display: inline-block; cursor: pointer; transition: background 0.15s; border-radius: 2px; font-family: monospace; }
    .char-node:hover { background-color: rgba(34, 197, 94, 0.25); }
    .char-node.selected-char { background-color: rgba(34, 197, 94, 0.4); outline: 2px solid #22c55e; }
    
    .anchored-chord {
      position: absolute;
      bottom: 110%;
      left: 0;
      font-weight: bold;
      font-size: 0.85rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: auto;
      user-select: none;
      z-index: 20;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      font-family: monospace;
    }
    
    .word-token { display: inline-flex; flex-wrap: nowrap; margin-right: 0.5rem; margin-top: 1.8rem; position: relative; }
    .line-row { display: flex; flex-wrap: wrap; align-items: flex-end; min-height: 2.8rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden select-none">

  <!-- Top Navigation -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white font-black text-lg">
        <i class="fa-solid fa-music"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm tracking-wide text-white leading-tight">ChordCraft</h1>
        <p class="text-[10px] text-slate-400 font-medium">Anchor Studio</p>
      </div>
    </div>

    <!-- Mode Switcher -->
    <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
      <button id="btn-mode-setup" onclick="setMode('setup')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5">
        <i class="fa-solid fa-pen-to-square text-xs"></i> <span>Setup</span>
      </button>
      <button id="btn-mode-edit" onclick="setMode('edit')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5">
        <i class="fa-solid fa-guitar text-xs"></i> <span>Edit</span>
      </button>
      <button id="btn-mode-perform" onclick="setMode('perform')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5">
        <i class="fa-solid fa-play text-xs"></i> <span>Perform</span>
      </button>
    </div>
  </header>

  <!-- EDIT MODE: FIXED CHORD TOOLBAR TOP -->
  <div id="edit-chord-bar" class="bg-slate-900/95 backdrop-blur border-b border-slate-800 p-2.5 flex flex-col gap-2 shrink-0 z-20 shadow-xl transition-all">
    <div class="flex items-center justify-between">
      <div class="text-[11px] font-bold uppercase tracking-wider text-brand-500 flex items-center gap-1.5">
        <i class="fa-solid fa-crosshairs"></i>
        <span id="target-indicator">Tap any letter below to select target</span>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="clearSelectedChar()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700">Clear</button>
      </div>
    </div>

    <!-- Root Note Selector -->
    <div class="flex items-center gap-1 overflow-x-auto custom-scrollbar pb-1">
      <span class="text-[10px] font-bold text-slate-400 w-10 shrink-0 uppercase">Root:</span>
      <div class="flex items-center gap-1">
        <button onclick="selectAndPlaceRoot('C')" class="root-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs hover:bg-brand-600 transition">C</button>
        <button onclick="selectAndPlaceRoot('D')" class="root-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs hover:bg-brand-600 transition">D</button>
        <button onclick="selectAndPlaceRoot('E')" class="root-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs hover:bg-brand-600 transition">E</button>
        <button onclick="selectAndPlaceRoot('F')" class="root-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs hover:bg-brand-600 transition">F</button>
        <button onclick="selectAndPlaceRoot('G')" class="root-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs hover:bg-brand-600 transition">G</button>
        <button onclick="selectAndPlaceRoot('A')" class="root-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs hover:bg-brand-600 transition">A</button>
        <button onclick="selectAndPlaceRoot('B')" class="root-btn px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs hover:bg-brand-600 transition">B</button>
      </div>
      <div class="h-5 w-[1px] bg-slate-700 mx-1 shrink-0"></div>
      <div class="flex items-center gap-1 shrink-0">
        <button onclick="toggleAccidental('#')" id="btn-sharp" class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs">♯</button>
        <button onclick="toggleAccidental('b')" id="btn-flat" class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 font-bold text-xs">♭</button>
      </div>
    </div>

    <!-- Chord Quality Selector -->
    <div class="flex items-center gap-1 overflow-x-auto custom-scrollbar pb-1">
      <span class="text-[10px] font-bold text-slate-400 w-10 shrink-0 uppercase">Type:</span>
      <div class="flex items-center gap-1">
        <button onclick="selectAndPlaceQuality('')" class="quality-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-semibold">Maj</button>
        <button onclick="selectAndPlaceQuality('m')" class="quality-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-semibold">m</button>
        <button onclick="selectAndPlaceQuality('7')" class="quality-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-semibold">7</button>
        <button onclick="selectAndPlaceQuality('maj7')" class="quality-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-semibold">maj7</button>
        <button onclick="selectAndPlaceQuality('m7')" class="quality-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-semibold">m7</button>
        <button onclick="selectAndPlaceQuality('sus4')" class="quality-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-semibold">sus4</button>
        <button onclick="selectAndPlaceQuality('dim')" class="quality-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-semibold">dim</button>
        <button onclick="selectAndPlaceQuality('add9')" class="quality-btn px-2.5 py-1 rounded bg-slate-800 border border-slate-700 text-xs font-semibold">add9</button>
      </div>
    </div>
  </div>

  <!-- CONTROL TOOLBAR -->
  <div id="perform-toolbar" class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex items-center justify-between shrink-0 z-10">
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-slate-400">KEY:</span>
      <div class="flex items-center bg-slate-950 rounded-lg border border-slate-800 p-0.5">
        <button onclick="transpose(-1)" class="w-7 h-7 flex items-center justify-center text-slate-300 hover:bg-slate-800 rounded font-bold text-xs">-1</button>
        <span id="key-display" class="px-2 text-xs font-bold text-brand-500 min-w-[2.5rem] text-center">ORIG</span>
        <button onclick="transpose(1)" class="w-7 h-7 flex items-center justify-center text-slate-300 hover:bg-slate-800 rounded font-bold text-xs">+1</button>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="exportSongText()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-brand-500 rounded-lg text-xs font-semibold flex items-center gap-1">
        <i class="fa-solid fa-copy"></i> <span>Copy Song</span>
      </button>
      <button id="btn-autoscroll" onclick="toggleAutoScroll()" class="px-3 py-1.5 bg-slate-800 border border-slate-700 text-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1">
        <i class="fa-solid fa-angles-down"></i> <span>AutoScroll</span>
      </button>
    </div>
  </div>

  <!-- MAIN VIEWPORT CONTAINER -->
  <main class="flex-1 relative overflow-hidden bg-slate-950">
    
    <!-- SETUP MODE VIEW -->
    <div id="view-setup" class="absolute inset-0 p-4 flex flex-col gap-3">
      <label class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center justify-between">
        <span>Paste Raw Lyrics Below</span>
        <span class="text-[10px] text-slate-500 lowercase">chords above lyrics will auto-align</span>
      </label>
      <textarea id="raw-lyrics-input" class="flex-1 w-full bg-slate-900 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 focus:outline-none focus:border-brand-500 resize-none custom-scrollbar font-mono" placeholder="Paste your lyrics here..."></textarea>
      <button onclick="saveSetupLyrics()" class="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-right"></i> Save & Edit Chords
      </button>
    </div>

    <!-- EDIT & PERFORM CANVAS VIEW -->
    <div id="view-canvas" class="absolute inset-0 overflow-y-auto custom-scrollbar p-6 space-y-6">
      <div id="song-render-area" class="max-w-3xl mx-auto pt-4 pb-24"></div>
    </div>

  </main>
  <script>
    let currentMode = 'setup';
    let rawText = "";
    let parsedLines = [];
    let selectedCharTarget = null;
    
    let activeRoot = 'C';
    let activeAccidental = '';
    let activeQuality = '';
    let currentTransposeSemitones = 0;
    
    let isAutoScrolling = false;
    let autoScrollInterval = null;

    const CHROMATIC_SCALE = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    window.onload = () => {
      const savedSong = localStorage.getItem('chordcraft_raw_text');
      if (savedSong) {
        document.getElementById('raw-lyrics-input').value = savedSong;
      }
      setMode('setup');
    };

    function setMode(mode) {
      if (currentMode === 'setup' && mode !== 'setup') {
        saveSetupLyrics();
      }

      currentMode = mode;
      
      ['setup', 'edit', 'perform'].forEach(m => {
        const btn = document.getElementById(`btn-mode-${m}`);
        if (m === mode) {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 bg-brand-600 text-white shadow-md";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 text-slate-400 hover:text-slate-200";
        }
      });

      const editBar = document.getElementById('edit-chord-bar');
      const setupView = document.getElementById('view-setup');
      const canvasView = document.getElementById('view-canvas');

      if (mode === 'setup') {
        editBar.classList.add('hidden');
        setupView.classList.remove('hidden');
        canvasView.classList.add('hidden');
      } else if (mode === 'edit') {
        editBar.classList.remove('hidden');
        setupView.classList.add('hidden');
        canvasView.classList.remove('hidden');
        renderCanvas();
      } else if (mode === 'perform') {
        editBar.classList.add('hidden');
        setupView.classList.add('hidden');
        canvasView.classList.remove('hidden');
        clearSelectedChar();
        renderCanvas();
      }
    }

    function saveSetupLyrics() {
      rawText = document.getElementById('raw-lyrics-input').value;
      localStorage.setItem('chordcraft_raw_text', rawText);
      parseLyricsToState();
    }

    function isChordLine(line) {
      const trimmed = line.trim();
      if (!trimmed) return false;
      const tokens = trimmed.split(/\s+/);
      const chordPattern = /^[A-G][#b]?(m|maj|dim|aug|sus\d?|add\d?|\d)*(\/[A-G][#b]?)?$/;
      let chordMatches = 0;
      tokens.forEach(t => {
        if (chordPattern.test(t)) chordMatches++;
      });
      return (chordMatches / tokens.length) >= 0.5;
    }

    function parseLyricsToState() {
      const lines = rawText.split('\n');
      parsedLines = [];

      for (let i = 0; i < lines.length; i++) {
        const currentLine = lines[i];
        
        if (isChordLine(currentLine) && i + 1 < lines.length && !isChordLine(lines[i + 1])) {
          const chordLineStr = currentLine;
          const lyricLineStr = lines[i + 1];
          i++;

          parsedLines.push(buildLineObject(lyricLineStr, chordLineStr));
        } else {
          parsedLines.push(buildLineObject(currentLine, null));
        }
      }
    }

    function buildLineObject(lyricStr, chordStr) {
      const chars = lyricStr.split('').map(c => ({ char: c, chord: null }));

      if (chordStr) {
        const regex = /([A-G][#b]?(?:m|maj|dim|aug|sus\d?|add\d?|\d)*(?:\/[A-G][#b]?)?)/g;
        let match;
        while ((match = regex.exec(chordStr)) !== null) {
          const chordName = match[1];
          const pos = match.index;
          if (pos < chars.length) {
            chars[pos].chord = chordName;
          } else {
            while (chars.length < pos) {
              chars.push({ char: ' ', chord: null });
            }
            chars.push({ char: ' ', chord: chordName });
          }
        }
      }

      const tokens = [];
      let currentToken = { word: '', chars: [] };

      chars.forEach((cObj) => {
        if (cObj.char === ' ') {
          if (currentToken.chars.length > 0) {
            tokens.push(currentToken);
            currentToken = { word: '', chars: [] };
          }
          tokens.push({ word: ' ', chars: [cObj] });
        } else {
          currentToken.word += cObj.char;
          currentToken.chars.push(cObj);
        }
      });

      if (currentToken.chars.length > 0) {
        tokens.push(currentToken);
      }

      return { tokens };
    }

    function renderCanvas() {
      const container = document.getElementById('song-render-area');
      container.innerHTML = '';

      if (parsedLines.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-500 py-12">No lyrics pasted yet. Tap Setup to add lyrics.</div>';
        return;
      }

      parsedLines.forEach((line, lIdx) => {
        const lineEl = document.createElement('div');
        lineEl.className = 'line-row';

        line.tokens.forEach((token, tIdx) => {
          const wordEl = document.createElement('div');
          wordEl.className = 'word-token';

          token.chars.forEach((cObj, cIdx) => {
            const charEl = document.createElement('span');
            
            const isSelected = selectedCharTarget && 
              selectedCharTarget.lineIndex === lIdx && 
              selectedCharTarget.tokenIndex === tIdx && 
              selectedCharTarget.charIndex === cIdx;

            charEl.className = `char-node ${isSelected ? 'selected-char' : ''}`;
            charEl.innerText = cObj.char === ' ' ? '\u00A0' : cObj.char;

            if (cObj.chord) {
              const chordBadge = document.createElement('div');
              chordBadge.className = 'anchored-chord bg-brand-600 text-white border border-brand-500';
              chordBadge.innerText = transposeChordString(cObj.chord, currentTransposeSemitones);
              
              if (currentMode === 'edit') {
                chordBadge.onclick = (e) => {
                  e.stopPropagation();
                  cObj.chord = null;
                  renderCanvas();
                };
              }
              charEl.appendChild(chordBadge);
            }

            if (currentMode === 'edit') {
              charEl.onclick = (e) => {
                e.stopPropagation();
                selectedCharTarget = { lineIndex: lIdx, tokenIndex: tIdx, charIndex: cIdx };
                document.getElementById('target-indicator').innerText = `Target: "${cObj.char}" (Line ${lIdx + 1})`;
                renderCanvas();
              };
            }

            wordEl.appendChild(charEl);
          });

          lineEl.appendChild(wordEl);
        });

        container.appendChild(lineEl);
      });
    }

    function selectAndPlaceRoot(r) {
      activeRoot = r;
      applyChordDirectly();
    }

    function selectAndPlaceQuality(q) {
      activeQuality = q;
      applyChordDirectly();
    }

    function toggleAccidental(acc) {
      activeAccidental = activeAccidental === acc ? '' : acc;
      updateAccidentalUI();
      applyChordDirectly();
    }

    function updateAccidentalUI() {
      document.getElementById('btn-sharp').className = `px-2.5 py-1.5 rounded-lg border font-bold text-xs ${activeAccidental === '#' ? 'bg-brand-600 border-brand-500 text-white' : 'bg-slate-800 border-slate-700'}`;
      document.getElementById('btn-flat').className = `px-2.5 py-1.5 rounded-lg border font-bold text-xs ${activeAccidental === 'b' ? 'bg-brand-600 border-brand-500 text-white' : 'bg-slate-800 border-slate-700'}`;
    }

    function applyChordDirectly() {
      if (!selectedCharTarget) {
        alert("Please tap a letter in the lyrics below first!");
        return;
      }
      const fullChord = `${activeRoot}${activeAccidental}${activeQuality}`;
      const { lineIndex, tokenIndex, charIndex } = selectedCharTarget;
      
      parsedLines[lineIndex].tokens[tokenIndex].chars[charIndex].chord = fullChord;
      renderCanvas();
    }

    function clearSelectedChar() {
      selectedCharTarget = null;
      document.getElementById('target-indicator').innerText = 'Tap any letter below to select target';
      renderCanvas();
    }

    function transpose(semitones) {
      currentTransposeSemitones += semitones;
      document.getElementById('key-display').innerText = currentTransposeSemitones === 0 ? 'ORIG' : (currentTransposeSemitones > 0 ? `+${currentTransposeSemitones}` : `${currentTransposeSemitones}`);
      renderCanvas();
    }

    function transposeChordString(chordStr, semitones) {
      if (semitones === 0) return chordStr;
      return chordStr.replace(/([A-G][#b]?)/g, (match) => shiftNote(match, semitones));
    }

    function shiftNote(note, semitones) {
      let normalized = note;
      if (note === 'Db') normalized = 'C#';
      if (note === 'Eb') normalized = 'D#';
      if (note === 'Gb') normalized = 'F#';
      if (note === 'Ab') normalized = 'G#';
      if (note === 'Bb') normalized = 'A#';

      let idx = CHROMATIC_SCALE.indexOf(normalized);
      if (idx === -1) return note;

      let newIdx = (idx + semitones) % 12;
      if (newIdx < 0) newIdx += 12;
      return CHROMATIC_SCALE[newIdx];
    }

    function toggleAutoScroll() {
      isAutoScrolling = !isAutoScrolling;
      const btn = document.getElementById('btn-autoscroll');
      const container = document.getElementById('view-canvas');

      if (isAutoScrolling) {
        btn.className = "px-3 py-1.5 bg-brand-600 border border-brand-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1 animate-pulse";
        autoScrollInterval = setInterval(() => { container.scrollTop += 1; }, 40);
      } else {
        btn.className = "px-3 py-1.5 bg-slate-800 border border-slate-700 text-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1";
        clearInterval(autoScrollInterval);
      }
    }

    function exportSongText() {
      let output = "";

      parsedLines.forEach(line => {
        let allChars = [];
        line.tokens.forEach(token => {
          token.chars.forEach(cObj => {
            allChars.push(cObj);
          });
        });

        let chordLineArr = new Array(allChars.length).fill(' ');
        let lyricLineArr = [];
        let hasChords = false;

        allChars.forEach((cObj, idx) => {
          lyricLineArr.push(cObj.char);
          if (cObj.chord) {
            hasChords = true;
            const transposed = transposeChordString(cObj.chord, currentTransposeSemitones);
            for (let k = 0; k < transposed.length; k++) {
              if (idx + k < chordLineArr.length) {
                chordLineArr[idx + k] = transposed[k];
              } else {
                chordLineArr.push(transposed[k]);
              }
            }
          }
        });

        if (hasChords) {
          output += chordLineArr.join('').trimEnd() + "\n";
        }
        output += lyricLineArr.join('') + "\n";
      });

      navigator.clipboard.writeText(output).then(() => {
        alert("Song copied! Paste it in your notes app.");
      }).catch(() => {
        alert("Copied output:\n\n" + output);
      });
    }
  </script>
</body>
</html>
